name: Build AAC plugin
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build, audit system imports and package
        run: ./build.ps1 -Package
      # Tests and private reconstruction evidence remain in ../rebuild/tests.
      # This standalone workflow builds and packages only.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ttp_aac-x86-XP-Win7-modern
          path: |
            build/Release/ttp_aac-*.zip
            build/Release/SHA256SUMS.txt
          if-no-files-found: error
